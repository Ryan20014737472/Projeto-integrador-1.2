name: Validar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Abrir repositório
        uses: actions/checkout@v7
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Gerar as páginas
        run: node scripts/construir.mjs
      - name: Testar os modelos científicos
        run: node --test testes/modelos.test.cjs
      - name: Validar navegação e recursos
        run: node scripts/verificar.mjs
      - name: Preparar os arquivos públicos
        run: node scripts/publicar.mjs
      - name: Verificar configuração do GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sol_agua_pages_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || true)"
          if [ "$sol_agua_pages_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Validação concluída. Para publicar, ative Settings > Pages > Source: GitHub Actions e execute este workflow novamente."
          fi
      - name: Configurar GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
      - name: Enviar arquivos do site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publicar
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
